    w(m2[2].replace(/[^A-Za-zÀ-ÿ' -]/g," ")).some(function(x){if(STOP.test(x))return R.length>0;R.push(x);return R.length>=3});
    if(L.length)r.d=cap(L.slice(-3).join(" "));if(R.length)r.a=cap(R.join(" "));
  }
  if(!r.d&&f.length===1)r.d=f[0].c;
  return r;
}
